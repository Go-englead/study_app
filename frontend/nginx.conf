server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA フォールバック（TanStack Router のクライアントルーティング）
  location / {
    try_files $uri $uri/ /index.html;
  }

  # /api/* を API コンテナ（:3000）へプロキシ（/api を剥がして転送）
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
