name: API Integration Tests

on:
  push:
    paths:
      - 'api/**'
      - '.github/workflows/api-integration.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api-integration.yml'

jobs:
  integration:
    # ubuntu ランナーは Docker がプリインストール＆稼働済みのため Testcontainers が動く
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run integration tests (Vitest + Testcontainers)
        run: npm test
